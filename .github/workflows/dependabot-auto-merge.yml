name: Dependabot auto-merge

# Dependabot の PR のうち、メジャー以外（minor / patch）の更新を自動マージする。
# 実際のマージは --auto でキューに積むだけなので、main のブランチ保護で
# PR Build Check（build job）を必須チェックにしておけば、ビルドが緑のときだけ取り込まれる。
# メジャー更新（例: react 18→19, vite 6→8）は対象外にして手動レビューに回す。
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # only from dependabot
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
