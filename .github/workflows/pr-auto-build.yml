name: PR Build Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同じ PR で新しい push が来たら古い実行はキャンセルして節約。
concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test
